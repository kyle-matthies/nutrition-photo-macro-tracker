name: Bug report
description: Report a reproducible problem without sharing private nutrition data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach real meal photos, credentials, health records, or production database rows."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Use synthetic inputs and redact secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
